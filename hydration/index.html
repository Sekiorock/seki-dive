<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05081A">
  <title>セキオダイブ</title>
  <!-- 文字：日本語は M PLUS 1p、英語と数字はゲームらしい Chakra Petch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&family=Chakra+Petch:wght@500;700&display=swap">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-title-key="hb.title">
  <header id="topbar"></header>

  <!-- 3Dの空間（タイトルの画面では背景として動く） -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="hb-frame" aria-hidden="true"></div>

  <!-- タイトル -->
  <section id="title" class="hb-screen hb-title" hidden>
    <div class="hb-logo">
      <p class="hb-logo__layer" data-i18n="hb.layer"></p>
      <h1 class="hb-logo__name" data-i18n="hb.title"></h1>
      <p class="hb-logo__tag" data-i18n="hb.tagline"></p>
    </div>
    <div class="hb-guide">
      <img class="hb-guide__stand" alt="" width="1024" height="1536">
      <p class="hb-guide__line"></p>
    </div>
    <h2 class="hb-sec" data-i18n="hb.pickChart"></h2>
    <div class="hb-charts" id="chart-pick"></div>
    <h2 class="hb-sec" data-i18n="hb.pickDiff"></h2>
    <div class="hb-diff" id="diff-pick" role="group" data-i18n-aria="hb.pickDiff"></div>
    <p class="hb-diff__note" id="diff-note"></p>
    <details class="hb-howto-box">
      <summary data-i18n="hb.howto.title"></summary>
      <ol class="hb-howto">
        <li data-i18n="hb.howto.1"></li>
        <li class="is-o" data-i18n="hb.howto.2"></li>
        <li class="is-h" data-i18n="hb.howto.3"></li>
        <li class="is-oh" data-i18n="hb.howto.4"></li>
        <li class="is-oh" data-i18n="hb.howto.5"></li>
        <li class="is-pass" data-i18n="hb.howto.6"></li>
        <li data-i18n="hb.howto.7"></li>
        <li class="is-mix" data-i18n="hb.howto.8"></li>
      </ol>
    </details>
    <!-- v0.5：道具屋で買った券（ヒント券・苦手問題の練習券） -->
    <div class="hb-tickets" id="tickets"></div>
    <div class="hb-title__actions">
      <button type="button" class="btn btn--primary hb-title__solo" data-act="solo" data-i18n="hb.solo"></button>
      <button type="button" class="btn hb-title__battle" data-act="battle" data-i18n="hb.battle"></button>
    </div>
    <div class="hb-title__sub2">
      <button type="button" class="btn hb-title__zukan" data-act="zukan" data-i18n="hb.zukan.open"></button>
      <button type="button" class="btn hb-title__shop" data-act="shop" data-i18n="hb.shop.open"></button>
    </div>
    <button type="button" class="btn hb-title__calib" data-act="calib"><span data-i18n="hb.calib.open"></span><b id="calib-now"></b></button>
    <p class="hb-title__note" data-i18n="hb.battleNote"></p>
    <p class="hb-title__note hb-title__keys" data-i18n="hb.howto.keys"></p>
    <p class="hb-title__note" data-i18n="hiyama.disclaimer"></p>
  </section>

  <!-- タイミング調整（ハイドレーション・ビート仕様書 4章） -->
  <section id="calib" class="hb-screen hb-calib" hidden>
    <h2 class="hb-calib__title" data-i18n="hb.calib.title"></h2>
    <p class="hb-calib__lead" data-i18n="hb.calib.lead"></p>
    <div class="hb-calib__beat" id="calib-beat" aria-hidden="true"><i></i></div>
    <p class="hb-calib__state" id="calib-state" aria-live="polite"></p>
    <ol class="hb-calib__dots" id="calib-dots" aria-hidden="true"></ol>
    <button type="button" class="hb-calib__pad" id="calib-pad" data-i18n-aria="hb.calib.tapAria"><span data-i18n="hb.calib.tap"></span></button>
    <div class="hb-calib__result">
      <p class="hb-calib__value"><span data-i18n="hb.calib.value"></span><b id="calib-value">0 ms</b></p>
      <div class="hb-calib__nudge">
        <button type="button" class="btn btn--small" data-act="calib-minus">−10 ms</button>
        <button type="button" class="btn btn--small" data-act="calib-plus">+10 ms</button>
      </div>
      <p class="hb-calib__hint" id="calib-hint"></p>
    </div>
    <div class="hb-calib__actions">
      <button type="button" class="btn" data-act="calib-start" id="calib-start" data-i18n="hb.calib.start"></button>
      <button type="button" class="btn btn--primary" data-act="calib-save" data-i18n="hb.calib.save"></button>
    </div>
    <button type="button" class="btn btn--small hb-calib__skip" data-act="calib-skip" data-i18n="hb.calib.skip"></button>
  </section>

  <!-- 図鑑（ハイドレーション・ビート仕様書 5章・8章）：保存した解説と、溶質の3D模型 -->
  <section id="zukan" class="hb-screen hb-zukan" hidden>
    <h2 class="hb-zukan__title" data-i18n="hb.zukan.title"></h2>
    <div class="hb-zukan__tabs" role="tablist">
      <button type="button" class="hb-zukan__tab" role="tab" data-act="zukan-tab" data-tab="models" data-i18n="hb.zukan.models"></button>
      <button type="button" class="hb-zukan__tab" role="tab" data-act="zukan-tab" data-tab="notes" data-i18n="hb.zukan.notes"></button>
      <button type="button" class="hb-zukan__tab" role="tab" data-act="zukan-tab" data-tab="pages" data-i18n="hb.zukan.pages"></button>
    </div>
    <div class="hb-zukan__body" id="zukan-body"></div>
    <button type="button" class="btn hb-zukan__back" data-act="zukan-close" data-i18n="hb.zukan.back"></button>
  </section>

  <!-- ショップ（v0.5：演出エフェクト） -->
  <section id="shop" class="hb-screen hb-zukan hb-shop" hidden>
    <h2 class="hb-zukan__title" data-i18n="hb.shop.title"></h2>
    <p class="hb-zukan__empty" data-i18n="hb.shop.lead"></p>
    <div class="hb-shop__list" id="shop-list"></div>
    <p class="hb-zukan__empty" data-i18n="hb.shop.tickets"></p>
    <p class="hb-title__note" data-i18n="hiyama.disclaimer"></p>
    <button type="button" class="btn hb-zukan__back" data-act="shop-close" data-i18n="hb.zukan.back"></button>
  </section>

  <!-- 対戦（v0.8：タイマン）。中身は battle.js が描く -->
  <section id="battle" class="hb-screen hb-zukan hb-battle" hidden></section>

  <!-- プレイ -->
  <section id="play" class="hb-screen hb-play" hidden>
    <div class="hb-hud">
      <div class="hb-hud__score"><span data-i18n="hb.score"></span><b id="hud-score">0</b></div>
      <div class="hb-gauge" id="hud-gauge" role="meter" aria-valuemin="0" aria-valuemax="100" data-i18n-aria="hb.gauge">
        <span class="hb-gauge__label"><span data-i18n="hb.gauge"></span><b id="hud-gauge-pct">0%</b></span>
        <div class="hb-gauge__bar"><i class="hb-gauge__fill" id="hud-gauge-fill"></i><i class="hb-gauge__mark"></i></div>
      </div>
      <button type="button" class="btn btn--small hb-hud__pause" data-act="pause" data-i18n-aria="hb.pause">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="hb-combo" id="hud-combo" aria-live="off"><b></b><span data-i18n="hb.combo"></span></div>
    <p class="hb-judge" id="hud-judge" aria-live="polite"></p>
    <p class="hb-ready" id="hud-ready"></p>
    <div class="hb-cutin" id="cutin" aria-hidden="true"><img alt=""><p></p></div>
    <div class="hb-pads">
      <button type="button" class="hb-pad hb-pad--o" data-input="O" data-i18n-aria="hb.btn.Oaria">
        <span class="hb-pad__atom">O</span><span class="hb-pad__sign">−</span><span class="hb-pad__sub" data-i18n="hb.btn.Osub"></span>
      </button>
      <button type="button" class="hb-pad hb-pad--h" data-input="H" data-i18n-aria="hb.btn.Haria">
        <span class="hb-pad__atom">H</span><span class="hb-pad__sign">+</span><span class="hb-pad__sub" data-i18n="hb.btn.Hsub"></span>
      </button>
      <!-- 溶媒がヘキサンのとき（ステージ5・6）は、左右のボタンが中央の「なじむ」1つにまとまる -->
      <button type="button" class="hb-pad hb-pad--m" data-input="M" data-i18n-aria="hb.btn.Maria">
        <span class="hb-pad__atom" data-i18n="hb.btn.M"></span><span class="hb-pad__sub" data-i18n="hb.btn.Msub"></span>
      </button>
    </div>
    <p class="hb-solvent" id="hud-solvent" aria-live="polite"></p>
    <!-- v0.8：対戦の相手（左の上）と、妨害の知らせ -->
    <div class="hb-rival" id="hud-rival" hidden>
      <img alt="" width="36" height="36">
      <div><b class="hb-rival__name"></b><span class="hb-rival__score"></span>
        <i class="hb-rival__gauge"><i></i></i><span class="hb-rival__combo"></span></div>
    </div>
    <p class="hb-attack" id="hud-attack" aria-live="polite"></p>
  </section>

  <!-- 一時停止 -->
  <div id="pause" class="hb-overlay" role="dialog" aria-modal="true" hidden>
    <div class="hb-overlay__box">
      <h2 class="hb-overlay__title" data-i18n="hb.pause.title"></h2>
      <button type="button" class="btn btn--primary" data-act="resume" data-i18n="hb.pause.resume"></button>
      <button type="button" class="btn" data-act="retry" data-i18n="hb.pause.retry"></button>
      <button type="button" class="btn" data-act="to-title" data-i18n="hb.pause.toTitle"></button>
      <button type="button" class="btn" data-act="home" data-i18n="hb.pause.home"></button>
    </div>
  </div>
  <!-- 対戦中は止められないので、やめるかどうかだけ聞く -->
  <div id="bpause" class="hb-overlay" role="dialog" aria-modal="true" hidden>
    <div class="hb-overlay__box">
      <h2 class="hb-overlay__title" data-i18n="hb.battle.pauseTitle"></h2>
      <p class="hb-zukan__empty" id="bpause-note"></p>
      <button type="button" class="btn btn--primary" data-act="bpause-close" data-i18n="hb.battle.keep"></button>
      <button type="button" class="btn" data-act="battle-forfeit" data-i18n="hb.battle.forfeit"></button>
    </div>
  </div>

  <!-- 結果 -->
  <section id="result" class="hb-screen hb-result" hidden></section>

  <!-- Perfect のときに一瞬だけ画面を反転させる（ハイドレーション・ビート仕様書 8章） -->
  <div id="flash" class="hb-flash" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <p id="loading" class="hb-loading" role="status" hidden></p>
  <div id="version" class="version"></div>

  <!-- 3Dの描画（Three.js r128、ホームと同じ版）。cdnjs から -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
