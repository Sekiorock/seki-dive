<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05081A">
  <title>セキオダイブ</title>
  <!-- 文字：日本語は M PLUS 1p、英語と数字はゲームらしい Chakra Petch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&family=Chakra+Petch:wght@500;700&display=swap">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-title-key="hb.title">
  <header id="topbar"></header>

  <!-- 3Dの空間（タイトルの画面では背景として動く） -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="hb-frame" aria-hidden="true"></div>

  <!-- タイトル -->
  <section id="title" class="hb-screen hb-title" hidden>
    <div class="hb-logo">
      <p class="hb-logo__layer" data-i18n="hb.layer"></p>
      <h1 class="hb-logo__name" data-i18n="hb.title"></h1>
      <p class="hb-logo__tag" data-i18n="hb.tagline"></p>
    </div>
    <div class="hb-guide">
      <img class="hb-guide__stand" alt="" width="1024" height="1536">
      <p class="hb-guide__line"></p>
    </div>
    <h2 class="hb-sec" data-i18n="hb.pickChart"></h2>
    <div class="hb-charts" id="chart-pick"></div>
    <h2 class="hb-sec" data-i18n="hb.pickDiff"></h2>
    <div class="hb-diff" id="diff-pick" role="group" data-i18n-aria="hb.pickDiff"></div>
    <p class="hb-diff__note" id="diff-note"></p>
    <details class="hb-howto-box">
      <summary data-i18n="hb.howto.title"></summary>
      <ol class="hb-howto">
        <li data-i18n="hb.howto.1"></li>
        <li class="is-o" data-i18n="hb.howto.2"></li>
        <li class="is-h" data-i18n="hb.howto.3"></li>
        <li class="is-oh" data-i18n="hb.howto.4"></li>
        <li class="is-oh" data-i18n="hb.howto.5"></li>
        <li class="is-pass" data-i18n="hb.howto.6"></li>
        <li data-i18n="hb.howto.7"></li>
      </ol>
    </details>
    <div class="hb-title__actions">
      <button type="button" class="btn btn--primary hb-title__solo" data-act="solo" data-i18n="hb.solo"></button>
      <button type="button" class="btn hb-title__battle" disabled data-i18n="hb.battle"></button>
    </div>
    <p class="hb-title__note" data-i18n="hb.battleSoon"></p>
    <p class="hb-title__note hb-title__keys" data-i18n="hb.howto.keys"></p>
    <p class="hb-title__note" data-i18n="hiyama.disclaimer"></p>
  </section>

  <!-- プレイ -->
  <section id="play" class="hb-screen hb-play" hidden>
    <div class="hb-hud">
      <div class="hb-hud__score"><span data-i18n="hb.score"></span><b id="hud-score">0</b></div>
      <button type="button" class="btn btn--small hb-hud__pause" data-act="pause" data-i18n-aria="hb.pause">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="hb-combo" id="hud-combo" aria-live="off"><b></b><span data-i18n="hb.combo"></span></div>
    <p class="hb-judge" id="hud-judge" aria-live="polite"></p>
    <p class="hb-ready" id="hud-ready"></p>
    <div class="hb-cutin" id="cutin" aria-hidden="true"><img alt=""><p></p></div>
    <div class="hb-pads">
      <button type="button" class="hb-pad hb-pad--o" data-input="O" data-i18n-aria="hb.btn.Oaria">
        <span class="hb-pad__atom">O</span><span class="hb-pad__sign">−</span><span class="hb-pad__sub" data-i18n="hb.btn.Osub"></span>
      </button>
      <button type="button" class="hb-pad hb-pad--h" data-input="H" data-i18n-aria="hb.btn.Haria">
        <span class="hb-pad__atom">H</span><span class="hb-pad__sign">+</span><span class="hb-pad__sub" data-i18n="hb.btn.Hsub"></span>
      </button>
    </div>
  </section>

  <!-- 一時停止 -->
  <div id="pause" class="hb-overlay" role="dialog" aria-modal="true" hidden>
    <div class="hb-overlay__box">
      <h2 class="hb-overlay__title" data-i18n="hb.pause.title"></h2>
      <button type="button" class="btn btn--primary" data-act="resume" data-i18n="hb.pause.resume"></button>
      <button type="button" class="btn" data-act="retry" data-i18n="hb.pause.retry"></button>
      <button type="button" class="btn" data-act="to-title" data-i18n="hb.pause.toTitle"></button>
      <button type="button" class="btn" data-act="home" data-i18n="hb.pause.home"></button>
    </div>
  </div>

  <!-- 結果 -->
  <section id="result" class="hb-screen hb-result" hidden></section>

  <!-- Perfect のときに一瞬だけ画面を反転させる（ハイドレーション・ビート仕様書 8章） -->
  <div id="flash" class="hb-flash" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <p id="loading" class="hb-loading" role="status" hidden></p>
  <div id="version" class="version"></div>

  <!-- 3Dの描画（Three.js r128、ホームと同じ版）。cdnjs から -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
