<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05081A">
  <title>セキオダイブ</title>
  <!-- 文字：日本語は M PLUS 1p、英語と数字はゲームらしい Chakra Petch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&family=Chakra+Petch:wght@500;700&display=swap">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-title-key="cr.title">
  <header id="topbar"></header>

  <!-- 3Dの実験台 -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="cr-frame" aria-hidden="true"></div>

  <!-- タイトル -->
  <section id="title" class="cr-screen cr-title" hidden>
    <div class="cr-logo">
      <p class="cr-logo__layer" data-i18n="cr.layer"></p>
      <h1 class="cr-logo__name" data-i18n="cr.title"></h1>
      <p class="cr-logo__tag" data-i18n="cr.tagline"></p>
    </div>
    <div class="cr-guide">
      <img class="cr-guide__stand" alt="" width="1024" height="1536">
      <p class="cr-guide__line"></p>
    </div>
    <h2 class="cr-sec" data-i18n="cr.benches"></h2>
    <div class="cr-cards">
      <button type="button" class="cr-card" data-act="pick-bench" data-bench="solid"><b data-i18n="cr.bench.solid"></b><span data-i18n="cr.bench.solidSub"></span></button>
      <button type="button" class="cr-card" data-act="pick-bench" data-bench="gas"><b data-i18n="cr.bench.gas"></b><span data-i18n="cr.bench.gasSub"></span></button>
      <button type="button" class="cr-card" data-act="pick-bench" data-bench="conc"><b data-i18n="cr.bench.conc"></b><span data-i18n="cr.bench.concSub"></span></button>
    </div>
    <h2 class="cr-sec" data-i18n="cr.modes"></h2>
    <div class="cr-cards">
      <button type="button" class="cr-card is-on" data-act="free"><b data-i18n="cr.mode.free"></b><span data-i18n="cr.mode.freeSub"></span></button>
      <button type="button" class="cr-card" disabled><b data-i18n="cr.mode.order"></b><span data-i18n="cr.soon3"></span></button>
      <button type="button" class="cr-card" disabled><b data-i18n="cr.mode.refine"></b><span data-i18n="cr.soon3"></span></button>
    </div>
    <button type="button" class="btn btn--primary cr-start" data-act="free" data-i18n="cr.start"></button>
    <button type="button" class="btn cr-sub" data-act="found" id="found-btn"></button>
    <p class="cr-note" data-i18n="hiyama.disclaimer"></p>
  </section>

  <!-- 実験台（自由実験）。固体・気体・濃度で、操作盤の中身を切りかえる -->
  <section id="lab" class="cr-screen cr-lab" hidden>
    <div class="cr-views" id="views" role="toolbar" data-i18n-aria="cr.view.label"></div>
    <div class="cr-bottom" id="bottom">
      <button type="button" class="btn btn--primary cr-seed" data-act="seed" id="seed-btn" hidden data-i18n="cr.seed"></button>
      <div class="cr-readout" id="readout" aria-live="polite"></div>
      <div class="cr-panel" id="panel">
        <div class="cr-panel__head">
          <div class="cr-tabs" role="tablist" id="bench-tabs">
            <button type="button" class="cr-tab" role="tab" data-act="bench" data-bench="solid" data-i18n="cr.bench.solid"></button>
            <button type="button" class="cr-tab" role="tab" data-act="bench" data-bench="gas" data-i18n="cr.bench.gas"></button>
            <button type="button" class="cr-tab" role="tab" data-act="bench" data-bench="conc" data-i18n="cr.bench.conc"></button>
          </div>
          <button type="button" class="cr-fold" data-act="fold" id="fold-btn" aria-expanded="true"></button>
        </div>
        <div class="cr-panel__body" id="panel-body">
          <!-- 固体 -->
          <div class="cr-ctl" id="ctl-solid">
            <div class="cr-solutes" id="solutes" role="radiogroup" data-i18n-aria="cr.solute"></div>
            <label class="cr-slider"><span><b data-i18n="cr.temp"></b><output id="v-temp"></output></span>
              <input type="range" id="s-temp"></label>
            <label class="cr-slider"><span><b data-i18n="cr.water"></b><output id="v-water"></output></span>
              <input type="range" id="s-water"></label>
            <label class="cr-slider"><span><b data-i18n="cr.mass"></b><output id="v-mass"></output></span>
              <input type="range" id="s-mass"></label>
          </div>
          <!-- 気体 -->
          <div class="cr-ctl" id="ctl-gas" hidden>
            <div class="cr-solutes" id="gases" role="radiogroup" data-i18n-aria="cr.g.gas"></div>
            <label class="cr-slider"><span><b data-i18n="cr.g.pressure"></b><output id="v-gp"></output></span>
              <input type="range" id="s-gp"></label>
            <label class="cr-slider"><span><b data-i18n="cr.temp"></b><output id="v-gt"></output></span>
              <input type="range" id="s-gt"></label>
            <div class="cr-row">
              <label class="cr-slider"><span><b data-i18n="cr.g.volume"></b><output id="v-gv"></output></span>
                <input type="range" id="s-gv"></label>
              <button type="button" class="btn cr-open" data-act="open-cap" id="open-btn" data-i18n="cr.g.open"></button>
            </div>
          </div>
          <!-- 濃度 -->
          <div class="cr-ctl" id="ctl-conc" hidden>
            <div class="cr-solutes cr-solutes--3" id="csolutes" role="radiogroup" data-i18n-aria="cr.solute"></div>
            <label class="cr-slider"><span><b data-i18n="cr.c.solute"></b><output id="v-cs"></output></span>
              <input type="range" id="s-cs"></label>
            <label class="cr-slider"><span><b data-i18n="cr.c.solvent"></b><output id="v-cw"></output></span>
              <input type="range" id="s-cw"></label>
            <label class="cr-slider"><span><b data-i18n="cr.c.density"></b><output id="v-cd"></output></span>
              <input type="range" id="s-cd"></label>
          </div>
          <div class="cr-panel__foot">
            <button type="button" class="btn btn--small" data-act="to-title" data-i18n="cr.toTitle"></button>
            <button type="button" class="btn btn--small" data-act="found" id="found-btn2"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 発見の一覧 -->
  <section id="found" class="cr-screen cr-found" hidden>
    <h2 class="cr-found__title" data-i18n="cr.found.title"></h2>
    <p class="cr-note" id="found-lead"></p>
    <ol class="cr-found__list" id="found-list"></ol>
    <button type="button" class="btn" data-act="found-close" data-i18n="cr.back"></button>
  </section>

  <!-- 発見したときの知らせ -->
  <div class="cr-discover" id="discover" role="status" aria-live="polite" hidden>
    <img alt="" width="64" height="64">
    <div><b></b><p></p><span></span></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <p id="loading" class="cr-loading" role="status" hidden></p>
  <div id="version" class="version"></div>

  <!-- 3Dの描画（Three.js r128、ほかのワールドと同じ版）。cdnjs から -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
