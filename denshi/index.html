      <rect x="180" y="140" width="150" height="96" rx="14" fill="#BFE0F8" opacity=".85"/><rect x="212" y="120" width="10" height="96" rx="4" fill="#B4B8C8"/><rect x="288" y="120" width="10" height="96" rx="4" fill="#B4B8C8"/>
      ${[[232, 200], [238, 176], [230, 152], [278, 196], [272, 168], [280, 146]].map(([x, y], k) => `<circle cx="${x}" cy="${y}" r="${k % 3 ? 6 : 8}" fill="#fff" opacity=".85"/>`).join('')}`,
    () => `${sky('#2B2756', '#3F3A78')}${stars}<circle cx="60" cy="50" r="20" fill="#FFF1C6"/>${hill('#3A5C80', 204)}<rect y="230" width="360" height="40" fill="#4A456B"/>
      <rect x="92" y="150" width="200" height="76" rx="16" fill="#BDE3D0"/><rect x="120" y="134" width="90" height="18" rx="9" fill="#F7F1FA"/><text x="165" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#3F7893">H₂</text>
      ${[108, 150, 192, 234].map((x) => `<rect x="${x}" y="164" width="34" height="26" rx="6" fill="#FFF1C6"/>`).join('')}${wheel(130, 230)}${wheel(254, 230)}
      ${[[70, 222], [54, 236], [78, 244]].map(([x, y]) => `<path d="M${x} ${y} q-7 10 0 14 q7 -4 0 -14z" fill="#9CCDE8"/>`).join('')}<rect x="318" y="150" width="5" height="80" fill="#E9E4F2"/><circle cx="320" cy="146" r="13" fill="#F7A9A0"/>`,
    () => `${sky('#BFE8E0', '#D9D0F0')}${hill('#A9C8D8', 200)}${[[30, 90, 34, 130], [74, 60, 30, 160], [300, 80, 36, 140]].map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w / 2}" fill="#F7F1FA" opacity=".9"/>`).join('')}
      ${[[120, 214], [136, 198], [152, 214], [144, 182], [168, 198], [184, 214], [160, 166]].map(([x, y], k) => `<rect x="${x}" y="${y}" width="26" height="14" rx="4" fill="${['#F7A9A0', '#9CCDE8', '#F5DC78'][k % 3]}"/>`).join('')}
      <path d="M216 196 h30 v-8 l16 14 l-16 14 v-8 h-30z" fill="#B9A56A"/>${[[270, 206], [300, 206], [285, 188]].map(([x, y]) => `<path d="M${x} ${y} h28 l-5 -14 h-18z" fill="#F5DC78"/><path d="M${x + 6} ${y - 11} h16" stroke="#fff" stroke-width="2" opacity=".8"/>`).join('')}`,
    () => `${sky('#FBD9C4', '#F9E7B8')}<circle cx="180" cy="150" r="60" fill="#FFE08A"/><circle cx="180" cy="150" r="84" fill="#FFE08A" opacity=".3"/>${hill('#BFD9B0', 190)}${house(24, 190, '#D99A8C', 1)}${house(272, 186, '#C9A0B8', 1)}`,
  ];
  return `<svg viewBox="0 0 360 270"><defs><filter id="kz${i}"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="${i + 3}"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs><g filter="url(#kz${i})">${S[i]()}</g></svg>`;
}
function kamiSheet(i) { const d = document.createElement('div'); d.className = 'kami__sheet'; d.innerHTML = `${kamiArt(i)}${i === 0 || i === 6 ? `<div class="kami__cast">${castHTML(i === 6 ? 'smile' : 'normal', false)}</div>` : ''}`; return d; }
async function kamiTo(i) {                  // 上の絵を横に引きぬくと、下から次の絵が出てくる
  const box = $('kamiBox'), old = box.lastElementChild; $('kami').hidden = false;
  if (KAMI.at === i && old) return; KAMI.at = i; const nu = kamiSheet(i); $('kamiT').textContent = tt('kb.t' + i); $('kamiR').textContent = `${tt('kb.role')}：${tt('kb.r' + i)}`;
  if (!old) { box.appendChild(nu); return; }
  box.insertBefore(nu, old); snd.hop(); old.classList.add('is-out'); await sleep(REDUCED ? 60 : 760); old.remove(); [...box.children].forEach((c) => { if (c !== nu) c.remove(); });
}
function kamiClose() { $('kami').hidden = true; $('kamiBox').innerHTML = ''; KAMI.at = -1; }
const kbAsk = (n, who, opts, ok) => ask('kb.q' + n, opts.map((x) => ({ k: `kb.q${n}.${x}`, ok: x === ok, why: x === ok ? `kb.q${n}.good` : `kb.q${n}.bad` })), who);
const KB = [[1, 'en', ['b', 'a'], 'a'], [2, 'akane', ['b', 'a', 'c'], 'a'], [3, 'akane', ['b', 'a', 'c'], 'a'], [4, 'en', ['a', 'c', 'b'], 'a'], [5, 'mikoto', ['c', 'b', 'a'], 'a']];
PQ.q17 = {
  id: 'q17', no: 'q17.name', name: 'q17.name', sub: 'q17.sub', sum: 'res.sum.q17', side: 'A', world: { kind: 'plain', ions: [] }, eq: [],
  setup(n) { const at = KAMI.at; resetWorld(); player.visible = buddy.visible = false; if (at >= 0 && Math.abs(at - n) <= 1) { KAMI.at = at; $('kami').hidden = false; } },   // となりの場面からは、引きぬいて変わる
  goldPre() { kamiTo(0); },
  gold: () => shuffle(KB).map(([n, , opts, ok]) => { const q = fact('kb.q' + n, opts.map((x) => [`kb.q${n}.${x}`, x === ok ? 1 : 0]), `kb.q${n}.good`); q.pre = () => { kamiTo(n); }; return q; }),
  stages: [
    async () => { await kamiTo(0); await say('kb.0', 'kb.start', 'mikoto'); },
    ...KB.map(([n, who, opts, ok]) => async () => { await kamiTo(n); await say('kb.' + n, 'next', 'mikoto'); await kbAsk(n, who, opts, ok); }),
    async () => { await kamiTo(6); await say('kb.6', 'kb.end', 'mikoto', 'smile'); },
  ],
};
QUESTS.c7 = chapter(7, 'c7.name', ['q17']);

const QUEST_IDS = ALL_Q;

/* 反応式の帯を、クエストに合わせて作る */
function buildEq() {
  $('eq').hidden = !Q.eq.length;
  $('eq').innerHTML = Q.eq.map((r) => `<div class="eq__row eq__row--${r.cls}"><span class="eq__pole eq__pole--${r.cls}" data-t="${r.pole}">${tt(r.pole)}</span><span class="eq__f eq__f--${r.cls}${r.long ? ' eq__f--long' : ''}">${r.terms.map(([id, s, e]) => `<span id="${id}"${e ? ' class="e"' : ''}>${Array.isArray(s) ? tt(s) : s}</span>`).join(' ')}</span>${r.kind ? `<span class="eq__kind" id="${r.kid}" data-t="${r.kind}">${tt(r.kind)}</span>` : ''}</div>`).join('');
}

/* ═════════ 進行：段階を順に進める。「戻る」で、いまの段階の最初（最初にいるなら1つ前）からやり直せる ═════════ */
let runId = 0, stageNo = 0, stagePos = 0, seenModel = false;
function openQuest(qid) { Q = QUESTS[qid]; buildEq(); $('qName').textContent = tt(Q.name); }
async function runFrom(n) {
  const id = ++runId; tweens.length = 0; clearTimeout(pop.t); $('pop').classList.remove('is-on');
  for (let k = n; k < Q.stages.length; k++) {
    stageNo = k; stagePos = 0; RUN.st[k] = { first: 0, asked: 0 }; idleSpin = false; Q.setup(k); setStep(k);
    await Q.stages[k]();
    if (id !== runId) return;
  }
  finish();
}
const dotsHTML = () => Q.stages.map((_, i) => `<i${i && Q.starts && Q.starts.includes(i) ? ' class="gap"' : ''}></i>`).join('');
function runQuest() { RUN = { miss: 0, pred: -1, st: [] }; delete SAVE[Q.id].prog; $('dots').innerHTML = dotsHTML(); $('stepBack').hidden = false; runFrom(0); }
function runResume() { const p = SAVE[Q.id].prog; if (!p) return runQuest(); RUN = JSON.parse(JSON.stringify(p.run)); $('dots').innerHTML = dotsHTML(); $('stepBack').hidden = false; runFrom(p.k); }   // 話の変わり目から続ける
async function runGold() {                  // 金印の試練：条件を変えた問いを5問
  const id = ++runId; tweens.length = 0;
  RUN = { miss: 0, pred: -1, st: [{ first: 0, asked: 0 }], gold: true }; stageNo = 0; stagePos = 0;
  $('dots').innerHTML = '<i></i>'.repeat(CONFIG.goldCount); $('stepBack').hidden = false;
  Q.setup(0); setView(Q.world.series ? 'series' : 'all'); idleSpin = !Q.world.series; setStep(-1);
  await say('gold.intro', 'next', 'mikoto');
  const set = goldSet(Q.id);
  for (let i = 0; i < set.length; i++) { setStep(i); if (set[i].pre) set[i].pre(); await ask(set[i].key, set[i].opts, 'mikoto', set[i].rec); if (id !== runId) return; }
  finish();
}
function toTitle() { kamiClose(); runId++; tweens.length = 0; amb.length = 0; ambTick = null; hideGap(); $('gauge').hidden = true; $('circ').hidden = true; ui.mode = 'idle'; ui.key = null; ui.result = null; render(); $('stepBack').hidden = true; $('ovResult').hidden = true; $('ovModel').hidden = true; renderTitle(); $('ovTitle').hidden = false; idleSpin = true; setView('all'); }
function stepBack() {
  snd.tap();
  const n = RUN.gold ? -1 : stagePos <= 1 ? stageNo - 1 : stageNo;
  if (n < 0) toTitle(); else runFrom(n);
}
function start(qid, gold, resume) {
  snd.start(); snd.tap(); openQuest(qid); pending = gold ? runGold : resume ? runResume : runQuest; $('ovTitle').hidden = true;
  if (!seenModel && !gold) $('ovModel').hidden = false; else pending();
}
let pending = null;

/* ═════════ 結果・報酬・記録 ═════════ */
function finish() {
  const sum = (f) => RUN.st.reduce((a, x) => a + (x ? x[f] : 0), 0), gold = !!RUN.gold;
  const grade = gold ? (RUN.miss === 0 ? 3 : 0) : RUN.miss === 0 ? 2 : 1;
  const S = SAVE[Q.id], prev = S.best, mult = Q.parts ? Q.parts.length : 1; S.plays++; if (grade > prev) S.best = grade; delete S.prog;
  if (Q.pred && !gold && RUN.pred >= 0) { const P = (SAVE.pred = SAVE.pred || {}), a = (P[Q.id] = P[Q.id] || [0, 0]); a[RUN.pred]++; }
  SAVE.at = new Date().toISOString(); saveAll(); runId++; $('stepBack').hidden = true;
  let gross = 0; for (let g = prev + 1; g <= grade; g++) gross += CONFIG.reward[g] * mult;   // まとめたクエストは、中身の話の数だけ報酬が増える
  if (!gross && grade > 0) gross = CONFIG.reward.replay;
  ui.result = { grade, gold, first: sum('first'), asked: sum('asked'), pred: RUN.pred, pay: gross ? 'wait' : 'none', q: Q };
  renderResult(); $('ovResult').hidden = false; if (grade > 0) snd.clear(); idle(null);
  if (gross) payOut(ui.result, gross, grade > prev ? grade : 0);
}
async function payOut(r, gross, seal) {      // ヒヤマを受け取る（広場の財布につながっているときだけ）
  if (!ECO.ready) r.pay = 'off';
  else try { const e = await ECO.eco.reward({ itemKey: seal ? 'ledger.item.dnSeal' + seal : 'ledger.item.dnReplay', itemVars: { n: r.q.id.slice(1) }, gross }); r.pay = e ? { gross: e.gross, net: e.amount } : 'cap'; } catch (err) { r.pay = 'off'; }
  if (ui.result === r) renderResult();
}
const tv = (key, vars) => tt(key).replace(/\{(\w+)\}/g, (_, k) => vars[k]);
function castHTML(expr, names) { return ['en', 'mikoto', 'akane'].map((id) => `<figure>${charSVG(id, expr)}${names ? `<b>${tt('ch.' + id)}</b>${tt('cast.' + id)}` : ''}</figure>`).join(''); }
function renderResult() {
  const r = ui.result; if (!r) return;
  const st = $('stamp'); st.className = 'stamp stamp--' + r.grade; st.textContent = tt('res.stamp.' + r.grade);
  $('resHead').textContent = tt(r.gold ? 'gold.btn' : 'res.clear');
  $('rank').textContent = tt('res.rank.' + r.grade);
  $('castRes').innerHTML = castHTML(r.grade > 0 ? 'smile' : 'normal', false);
  const pay = r.pay === 'none' ? '' : `<br>${typeof r.pay === 'object' ? tv('res.pay', { gross: fmt(r.pay.gross), net: fmt(r.pay.net) }) : tt('res.pay.' + r.pay)}`;
  const pred = r.q.pred && !r.gold ? `　${tt(r.pred === 0 ? 'res.pred.ok' : 'res.pred.ng')}` : '';
  const tip = r.gold ? tt('gold.sum') : r.grade < 2 ? tt('res.tip') : SAVE[r.q.id].best < 3 ? tt('res.tip.gold') : '';
  $('sum').innerHTML = `${tt('res.first')}：<b>${r.first} / ${r.asked}</b>${pred}<br>${tt(r.q.sum)}${tip ? `<br>${tip}` : ''}${pay}`;
}
const fmt = (n) => Math.round(n).toLocaleString('en-US');

/* 学習の記録：問いごとの回答数・一発正解の数・選ばれた誤答。広場の本人の記録（users/…/worlds/denshi）にも保存される */
const fkey = (s) => String(s).replace(/[.$#\[\]\/]/g, '_').slice(0, 60);
const plainJa = (k) => (Array.isArray(k) ? k[0] : (T[k] || [k])[0]).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').slice(0, 80);
function recEntry(rec, key) { const R = ((SAVE.rec = SAVE.rec || {})[Q.id] = SAVE.rec[Q.id] || {}), id = fkey(rec.id); return (R[id] = R[id] || { t: rec.label || plainJa(key), n: 0, ok: 0 }); }
function recAsk(rec, key, first) { const e = recEntry(rec, key); e.n++; if (first) e.ok++; saveAll(); }
function recMiss(rec, key, o) { const e = recEntry(rec, key); e.w = e.w || {}; const id = rec.dyn ? 'x' : fkey(o.k), w = (e.w[id] = e.w[id] || { t: rec.dyn ? '（まちがい）' : plainJa(o.k), n: 0 }); w.n++; }
function saveAll() { save(); if (ECO.ready) try { ECO.auth.setWorldData('denshi', SAVE); } catch (e) {} }

/* 広場の財布・記録につなぐ（単体のHTMLで開いたときや通信できないときは、この端末だけで動く） */
let ECO = { ready: false };
(async () => {
  try {
    const [auth, eco] = await Promise.all([import('../shared/auth.js'), import('../shared/economy.js')]);
    await auth.initBackend(); await eco.initEconomy();
    const remote = migrate(auth.getWorldData('denshi') || {});
    QUEST_IDS.forEach((id) => { const a = SAVE[id], b = remote[id] || {}; a.best = Math.max(a.best, b.best || 0); a.plays = Math.max(a.plays, b.plays || 0); });
    if (!SAVE.rec && remote.rec) SAVE.rec = remote.rec; if (!SAVE.pred && remote.pred) SAVE.pred = remote.pred;
    ECO = { ready: true, auth, eco }; saveAll(); renderTitle();
    eco.onWalletChange(() => { if (!$('ovTitle').hidden) renderTitle(); });
    eco.onSettingsChange(() => { if (!eco.isWorldOpen('denshi')) { $('wallet').textContent = tt('closed'); pop('closed', 'is-ng', 2600); setTimeout(() => { location.href = '../'; }, 2600); } });
  } catch (e) { /* この端末だけで動く */ }
})();

/* ═════════ 言語・音楽・タイトル・はじまり ═════════ */
function renderTitle() {
  $('wallet').textContent = ECO.ready ? tv('wallet', { n: fmt(ECO.eco.getBalance()) }) : '';
  $('questList').innerHTML = QUEST_IDS.map((id) => { const q = QUESTS[id], b = SAVE[id].best; return `<div class="qrow torn">
    <div class="qrow__t"><span class="card__no">${tt(q.no)}</span> <b>${tt(q.name)}</b>${b ? ` <span class="best best--${b}">${tt('best.' + b)}</span>` : ''}<small>${tt(q.sub)}</small></div>
    ${SAVE[id].prog ? `<button class="btn torn qrow__r" type="button" data-q="${id}">${tt('restart.s')}</button><button class="btn btn--main torn" type="button" data-r="${id}">${tt('resume.s')}</button>`
      : `${b >= 2 ? `<button class="btn torn qrow__g" type="button" data-g="${id}">${tt('gold.s')}</button>` : ''}<button class="btn btn--main torn" type="button" data-q="${id}">${tt('start.s')}</button>`}</div>`; }).join('');
}
function applyLang() {
  document.documentElement.lang = lang; document.title = tt('title.name');
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = tt(el.dataset.t); });
  $('langJa').setAttribute('aria-pressed', lang === 'ja'); $('langEn').setAttribute('aria-pressed', lang === 'en');
  $('qName').textContent = Q ? tt(Q.name) : '';
  $('modelList').innerHTML = ['model.1', 'model.2', 'model.3'].map((k) => `<li>${tt(k)}</li>`).join('');
  $('locked').hidden = true;
  $('cast').innerHTML = castHTML('normal', true); $('modelFace').innerHTML = charSVG('mikoto', 'smile');
  $('back').setAttribute('aria-label', tt('res.back')); $('bgmBtn').setAttribute('aria-label', tt('bgm')); $('stepBack').textContent = tt('back'); $('modelBack').textContent = tt('back');
  if (!$('circ').hidden) circDraw();
  labels.forEach(refreshLabel); updateViewBtn(); renderTitle(); render(); renderResult();
}
function setLang(l) { lang = l; store.set(CONFIG.langKey, l); applyLang(); }
$('langJa').addEventListener('click', () => setLang('ja'));
$('langEn').addEventListener('click', () => setLang('en'));
const bgmBtnState = () => $('bgmBtn').classList.toggle('is-off', !snd.bgmOn);
$('bgmBtn').addEventListener('click', () => { snd.toggleBgm(); bgmBtnState(); });

$('ver').textContent = CONFIG.version;
$('questList').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.q) start(b.dataset.q, false); else if (b.dataset.g) start(b.dataset.g, true); else if (b.dataset.r) start(b.dataset.r, false, true); });
$('btnModelOk').addEventListener('click', () => { snd.tap(); seenModel = true; $('ovModel').hidden = true; pending(); });
$('modelBack').addEventListener('click', () => { snd.tap(); toTitle(); });
$('stepBack').addEventListener('click', stepBack);
$('btnRetry').addEventListener('click', () => { snd.tap(); const g = ui.result && ui.result.gold; $('ovResult').hidden = true; ui.result = null; (g ? runGold : runQuest)(); });
$('btnToTitle').addEventListener('click', () => { snd.tap(); toTitle(); });

openQuest('c1'); Q.setup(0); setView('all'); cam.az = 0.25; cam.pol = 0.2;
applyLang(); bgmBtnState(); resize(); cam.dist = fitDist();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => labels.forEach(refreshLabel));
requestAnimationFrame(frame);
window.__denshi = { ui, cam, start, jump: (n) => runFrom(n), get stage() { return stageNo; }, get run() { return RUN; }, get save() { return SAVE; }, get eco() { return ECO.ready; }, get ions() { return ions; }, player };   // 動作確認用
</script>
